name: Daily Broadsheet Sweep & Auto-Publish (6:00 AM / 7:00 AM ET)

on:
  # Paused until Phase 2 feed fetchers + git commit/PR step are implemented, so
  # scheduled runs don't burn Gemini API quota and discard results; re-enable
  # once Phase 2 is wired.
  # schedule:
  #   # 6:00 AM ET (DST-safe via America/New_York): global court/regulator sweep,
  #   # research, drafting, impasto painting config generation, and wrist-slap scoring.
  #   - cron: '0 6 * * *'
  #     timezone: 'America/New_York'
  #   # 7:00 AM ET (DST-safe via America/New_York): auto-publish verified daily edition
  #   # to main, triggering Cloudflare Workers Static Assets CI/CD deployment.
  #   - cron: '0 7 * * *'
  #     timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline stage to execute'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - sweep
          - publish
      edition_date:
        description: 'Optional YYYY-MM-DD override (defaults to today in America/New_York)'
        required: false
        default: ''

# Least-privilege permissions until Phase 2 git commit/PR publishing is wired.
permissions:
  contents: read

concurrency:
  group: daily-broadsheet-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Daily Sweep / Publish Pipeline
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine stage (6:00 AM ET sweep vs 7:00 AM ET publish)
        id: stage
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_EDITION_DATE: ${{ inputs.edition_date }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          elif [ "$EVENT_SCHEDULE" = "0 7 * * *" ]; then
            MODE="publish"
          else
            MODE="sweep"
          fi
          case "$MODE" in
            sweep|publish|dry-run) ;;
            *) echo "::error::Invalid mode '$MODE'"; exit 1 ;;
          esac
          EDITION_DATE="$INPUT_EDITION_DATE"
          if [ -z "$EDITION_DATE" ]; then
            EDITION_DATE="$(date +%Y-%m-%d)"
          fi
          if ! [[ "$EDITION_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::edition_date must be YYYY-MM-DD"
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "edition_date=$EDITION_DATE" >> "$GITHUB_OUTPUT"

      - name: Run sweep / publish pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-pro' }}
          ANTIGRAVITY_AGENT_ENDPOINT: ${{ secrets.ANTIGRAVITY_AGENT_ENDPOINT }}
          ANTIGRAVITY_AGENT_TOKEN: ${{ secrets.ANTIGRAVITY_AGENT_TOKEN }}
        run: |
          node pipeline/run-sweep.mjs \
            --mode "${{ steps.stage.outputs.mode }}" \
            --date "${{ steps.stage.outputs.edition_date }}"

      - name: Validate content, run tests & build check
        run: |
          npm run validate:content
          npm test
          npm run check
          npm run build
